<!DOCTYPE html>
<html xmlns:th="htpp://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <!--<link type="text/css" rel="stylesheet" href="css/estiloA.css">-->

    <title>Lista Legajos</title>
</head>

<body>
    <!-- navbar para contener todo el menu -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container text-light">
            <strong>ARÉA PERSONAL</strong>
            <!-- boton para el despliegue -->
            <button class="navbar navbar-toggler" type="button" data-toggle="collapse" data-target="#menuprincipal"
                aria-controls="menuprincipal" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- lista de menu - forma hori o colapsado -->
            <div class="collapse navbar-collapse" id="menuprincipal">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">INCIO <span class="sr-only"> (current)</span></a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="#">ALTA <span class="sr-only"> (current)</span></a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="#">LICENCIA <span class="sr-only"> (current)</span></a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="#">ASISTENCIA <span class="sr-only"> (current)</span></a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="#">NÓMINA <span class="sr-only"> (current)</span></a>
                    </li>
                    <li class="nav-item dropdown">
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <div class="container">
        <div class="card">

            <div class="card-header text-white bg-secondary">
                <h3>Legajos</h3>
            </div>
            <div class="card-body">
                <!-- Buscador -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Buscar empleado por DNI">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary btn-block">Buscar</button>
                    </div>
                </div>

                <table class="table table-striped table-responsive-sm table-bordered table-hover table-sm">
                    <thead>
                        <tr>
                            <th>NOMBRE</th>
                            <th>APELLIDO</th>
                            <th>DNI</th>
                            <th>TELÉFONO</th>
                            <th width="15%" class="text-center"> <a class="btn btn-primary"><i class="fa fa-user-plus"
                                        aria-hidden="true"></i> Agregar </a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="text-center">
                                <span>
                                    <p>
                                        <a class="btn btn-warning btn-sm"><i class="fa fa-pencil-square-o"
                                                aria-hidden="true"></i></a>
                                        <a class="btn btn-info btn-sm"><i class="fa fa-users"
                                                aria-hidden="true"></i></a>
                                        <a class="btn btn-danger btn-sm"><i class="fa fa-user-minus"
                                                aria-hidden="true"></i></a>
                                        <a class="btn btn-secondary btn-sm"><i class="fas fa-user-clock"
                                                aria-hidden="true"></i></a>
                                        <a class="btn btn-success btn-sm"><i class="fas fa-file-invoice-dollar"
                                                aria-hidden="true"></i> </a>
                                        <a class="btn btn-warning btn-sm"><i class="fas fa-file-alt"
                                                aria-hidden="true"></i></a>
                                    </p>
                                </span>
                            </td>
                        </tr>
                    </tbody>  
                </table>
                
            </div>






        </div>
    </div>



    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/fonta.js}"></script>
</body>

</html>
