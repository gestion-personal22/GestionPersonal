<!DOCTYPE html>
<html xmlns:th="htpp://www.thymeleaf.org">
<head>
     <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

     <!-- Bootstrap CSS -->
    <link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" >

    <!-- <link type="text/css" rel="stylesheet" href="css/estiloA.css"> -->
        
    <title>Registro Legajos</title>
</head>
<body>

	<header th:replace="Home/inicio::header" ></header>
	
    <div class="container mt-5 ">
        <div class="card">
            <div class="card-header text-white bg-dark">
                <h3 class="text-center">Nuevo Legajo</h3>
            </div>
            <div class="card-body">
				
                <form th:action="@{/legajo/crear}" th:object="${legajo}" method="post">
					
                    <div class="form-group row">
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Nombre</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa fa-user"></i></span>
                                </div>
                                <input type="text" th:field="*{nombre}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Apellido</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa fa-user"></i></span>
                                </div>
                                <input type="text" th:field="*{apellido}" class="form-control" required>
                            </div>
                        </div>
                 </div>


                    <div class="form-group row">
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Fecha Nacimiento</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                                </div>
                                <input type="date" th:field="*{fechaNacimiento}" class="form-control" required>
								
								<input type="hidden" 
								       name="fechaRegistro" 
								       th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" 
								       required>
                            </div>
                        </div>
                    
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">DNI</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa fa-id-card"></i></span>
                                </div>
                                <input type="text" th:field="*{dni}" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">CUIL</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa fa-user"></i></span>
                                </div>
                                <input type="text" th:field="*{cuil}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Correo</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                </div>
                                <input type="email" th:field="*{correo}" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Telefono</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-phone-alt"></i></span>
                                </div>
                                <input type="text" th:field="*{telefono}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Formacion Academica</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-graduation-cap"></i></span>
                                </div>
                                <input type="text" th:field="*{titulo}" class="form-control" required>
                            </div>
                        </div>
                    </div>    


                    <div class="form-group row">
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Direccion</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fa fa-home"></i></span>
                                </div>
                                <input type="text" th:field="*{direccion}" class="form-control" required>
                            </div>
                        </div>

                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Estado Civil</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-user-friends"></i></span>
                                </div>
                                <select class="form-control" th:field="*{estadoCivil}" required>
									
                                    <option th:value="null"> -- </option>
									<option 
																		
									th:each="ec : ${listaEstadosCiviles}"
									th:value="${ec.id}"
								    th:text="${ec.estado}"
								   >
								   </option>
									
                                </select>
                            </div>
                        </div>

                    </div>


                    <div class="form-group row">
                        <div class="col-sm-12 col-md-6">
                            <label class="col-form-label">Cargo</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-briefcase"></i></span>
                                </div>
                                <select class="form-control" th:field="*{cargo}" required>
									
									<option th:value="null"> -- </option>
									<option 
									
									th:each="c : ${listaCargos}"
									th:value="${c.id}"
									th:text="${c.cargo}"
									>
									</option>
									                
									
                                </select>
                            </div>
                        </div> 
                    </div>
                        
                    <div class="form-group text-right">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa fa-save"></i> Guardar
                        </button>

						
						<button type="submit" class="btn btn-secondary">
						    <i class="fa fa-users"></i> Agregar Grupo Familiar
						</button>
						
						<button type="submit" class="btn btn-danger">
	                        <i class="fa fa-close"></i> Cancelar
			            </button>
 
                    </div>                
                </form>
            </div>

        </div>
    </div>



	<footer th:replace="Home/inicio::footer"> </footer>

    
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/fonta.js}"></script>
</body>
</html>
