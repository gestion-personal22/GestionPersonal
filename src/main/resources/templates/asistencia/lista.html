<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" >
	    <link type="text/css" rel="stylesheet" th:href="@{/css/fonta.css}" > 
        
    <title>Asistencia de Empleados</title>
</head>
<body>
    <header th:replace="Home/inicio::header" ></header>


    <div class="container">
    <div class="card">
        <div class="card-header text-white bg-dark">
            <h3>Lista de Asistencia de Empleados</h3>
        </div>    
      <div class="card-body">
        <table class="table table-striped table-responsive-sm table-bordered table-hover table-sm">
        <thead>
            <tr>
                <th>NOMBRE</th>
                <th>APELLIDO</th>
                <th>DNI</th>
                <th>FECHA</th>
                <th>HORA</th>
                <th>STATUS</th>
                <th width="15%" class="text-center"> 
                    <a class="btn btn-primary" title="Agregar Asistencia"><i class="fa fa-plus" aria-hidden="true"></i> Agregar</a>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                    <span>
                        <p >
                            <a class="btn btn-warning btn-sm" title="Editar Asistencia"><i class="fa fa-pencil-square-o" aria-hidden="true"></i> Editar</a>
                            <a class="btn btn-danger btn-sm" title="Eliminar Asistencia"><i class="fa fa-trash"></i> Eliminar</a>
                        </p>
                    </span>
                </td>
            </tr>
        </tbody>
        </table>

      </div>    
      </div>    
    </div>

	<footer th:replace="Home/inicio::footer"> </footer>
	
	<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
	<script th:src="@{/js/popper.min.js}"></script>
	<script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/fonta.js}"></script>
</body>
</html>
