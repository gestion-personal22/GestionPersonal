<!DOCTYPE html>
<html lang="es">
<head>
 
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


	<link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" >
	<link type="text/css" rel="stylesheet" th:href="@{/css/fonta.css}" > 
	        
        
    <title>Carga</title>
</head>
<body>
 
	<header th:replace="Home/inicio::header" ></header>
	
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header text-white bg-dark">
              <h3 class="text-center">Datos de Liquidación de Nómina</h3>
            </div>
            <div class="card-body">
              <form>
          
          
                <div class="form-group">
                  <label class="font-weight-bold">Empleado</label>
                  <input type="text" class="form-control" placeholder="Buscar empleado..." required>
                </div>
          
                <hr>
          
                
                <div class="form-group row">
                  <div class="col-sm-12 col-md-6">
                    <label>Período (MM/AAAA)</label>
                    <input type="month" class="form-control" required>
                  </div>
                  <div class="col-sm-12 col-md-6">
                    <label>Fecha de Pago</label>
                    <input type="date" class="form-control" required>
                  </div>
                </div>
          
                <h4 class="mt-4 mb-3">Haberes (Ingresos Brutos)</h4>
                <div class="form-group row">
                  <div class="col-sm-12 col-md-4">
                    <label>Sueldo Básico</label>
                    <input type="number" class="form-control" value="0.00">
                  </div>
                  <div class="col-sm-12 col-md-4">
                    <label>Adicional Antigüedad</label>
                    <input type="number" class="form-control" value="0.00">
                  </div>
                  <div class="col-sm-12 col-md-4">
                    <label>Total Remunerativo</label>
                    <input type="text" class="form-control bg-light font-weight-bold" readonly value="[CALCULADO]">
                  </div>
                </div>
          
                <h4 class="mt-4 mb-3">Deducciones (Descuentos)</h4>
                <div class="form-group row">
                  <div class="col-sm-12 col-md-4">
                    <label>Aporte Jubilatorio</label>
                    <input type="number" class="form-control" value="[CALCULADO %]">
                  </div>
                  <div class="col-sm-12 col-md-4">
                    <label>Desc. Obra Social</label>
                    <input type="number" class="form-control" value="[CALCULADO %]">
                  </div>
                  <div class="col-sm-12 col-md-4">
                    <label>Ret. Imp. Ganancias</label>
                    <input type="number" class="form-control" value="0.00">
                  </div>
                </div>
          
                <hr class="mt-4 mb-4">
          
                <div class="form-group row justify-content-center">
                  <div class="col-sm-12 col-md-6 text-center">
                    <label class="font-weight-bold h4 text-dark">NETO A COBRAR:</label>
                    <input type="text" class="form-control form-control-lg text-center font-weight-bold text-dark" readonly value=" [MONTO FINAL]">
                  </div>
                </div>
          
                <div class="form-group text-center mt-4">
                  <button type="submit" class="btn btn-dark">
                    <i class=></i> Liquidar y Guardar Nómina
                  </button>
                </div>
          
              </form>
            </div>
        </div>
    </div>
    <footer th:replace="Home/inicio::footer"> </footer>
    
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/fonta.js}"></script>
</body>
</html>
