<!DOCTYPE html>
<html lang="es">
<head>
     <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

     <!-- Bootstrap CSS -->
    <link type="text/css" rel="stylesheet" href="css/bootstrap.min.css">

    <link type="text/css" rel="stylesheet" href="css/estiloA.css">
        
    <title>Lista de Nómina</title>
</head>
<body>
      <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <strong>Instituto de Carreras Superiores 6030</strong>
            <button class="navbar-toggler" type="button" data-toggle="collapse"
             data-target="#menuprincipal" aria-controls="menuprincipal"
             aria-expanded="false">
             <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuprincipal">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">INICIO <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="#">ALTA <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="#">LISTA NÓMINA <span class="sr-only">(current)</span></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

   
    <div class="container mt-4 mb-5">
        <div class="card">
            <div class="card-header text-white bg-dark">
                <h3>Lista de Liquidaciones de Nómina</h3>
            </div>    
            <div class="card-body">
                <!-- Buscador -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Buscar empleado por nombre o DNI">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary btn-block">Buscar</button>
                    </div>
                </div>

                <!-- Tabla -->
                <table class="table table-striped table-responsive-sm table-bordered table-hover table-sm">
                    <thead class="thead-light">
                        <tr>
                            <th>Empleado</th>
                            <th>DNI</th>
                            <th>Cargo</th>
                            <th>Sueldo Base</th>
                            <th>Horas Extra</th>
                            <th>Descuentos</th>
                            <th>Sueldo Neto</th>
                            <th width="15%" class="text-center">
                                <a class="btn btn-success"><i class="fa fa-plus" aria-hidden="true"></i></a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="text-center">
                                <a class="btn btn-warning btn-sm"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></a>
                                <a class="btn btn-info btn-sm"><i class="fa fa-eye" aria-hidden="true"></i></a>
                                <a class="btn btn-danger btn-sm"><i class="fa fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>  
        </div>   
    </div>

    <!-- JS -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/fonta.js"></script>
</body>
</html>
