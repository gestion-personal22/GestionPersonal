<!DOCTYPE html>
<html lang="es">
<head>
     <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link type="text/css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" >
	    <link type="text/css" rel="stylesheet" th:href="@{/css/fonta.css}" > 
        
    <title>Lista de Nómina</title>
</head>
<body>
   
	<header th:replace="Home/inicio::header" ></header>
   
    <div class="container mt-4 mb-5">
        <div class="card">
            <div class="card-header text-white bg-dark">
                <h3>Lista de Liquidaciones de Nómina</h3>
            </div>    
            <div class="card-body">
                <!-- Buscador -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Buscar empleado por nombre o DNI">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary btn-block">Buscar</button>
                    </div>
                </div>

                <!-- Tabla -->
                <table class="table table-striped table-responsive-sm table-bordered table-hover table-sm">
                    <thead class="thead-light">
                        <tr>
                            <th>Empleado</th>
                            <th>DNI</th>
                            <th>Cargo</th>
                            <th>Sueldo Base</th>
                            <th>Horas Extra</th>
                            <th>Descuentos</th>
                            <th>Sueldo Neto</th>
                            <th width="15%" class="text-center">
                                <a class="btn btn-success"><i class="fa fa-plus" aria-hidden="true"></i></a>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td class="text-center">
                                <a class="btn btn-warning btn-sm"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></a>
                                <a class="btn btn-info btn-sm"><i class="fa fa-eye" aria-hidden="true"></i></a>
                                <a class="btn btn-danger btn-sm"><i class="fa fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>  
        </div>   
    </div>

	<footer th:replace="Home/inicio::footer"> </footer>
	
	<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
	   <script th:src="@{/js/popper.min.js}"></script>
	   <script th:src="@{/js/bootstrap.min.js}"></script>
	   <script th:src="@{/js/fonta.js}"></script>
</body>
</html>
